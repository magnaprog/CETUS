name: DOFA partial-training reconstruction

on: [push, pull_request]

permissions:
  contents: read

jobs:
  reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Check package files and synthetic examples
        working-directory: release/dofa-partial-20261112
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          python -B -m unittest -v test_reconstruct
      - name: Reconstruct all fifty saved predictions
        working-directory: release/dofa-partial-20261112
        run: |
          set -euo pipefail
          python -B reconstruct.py \
            --output "$RUNNER_TEMP/dofa-partial.json"
          sha256sum -c SHA256SUMS
          test -z "$(git status --porcelain=v1)"
      - name: Preserve reconstruction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dofa-partial-reconstruction
          path: ${{ runner.temp }}/dofa-partial.json
          if-no-files-found: warn
