name: Release inventory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum -c SHA256SUMS
      - name: Check index contents and source identity
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          tracked = set(subprocess.check_output(
              ['git', 'ls-files', '-z']).decode().split('\0')) - {''}
          index = json.loads(Path('file_index.json').read_text())
          assert set(index['files']) == tracked - {'file_index.json', 'SHA256SUMS'}, 'Index inventory differs'
          for name, record in index['files'].items():
              path = Path(name)
              assert not path.is_symlink(), f'Symlink in release: {name}'
              data = path.read_bytes()
              assert record == {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}, name
          sums = Path('SHA256SUMS').read_text().splitlines()
          names = [line.split('  ', 1)[1] for line in sums]
          assert len(names) == len(set(names)), 'Repeated checksum path'
          assert set(names) == tracked - {'SHA256SUMS'}, 'Checksum inventory differs'
          source = json.loads(Path('SOFTWARE_EXPORT.json').read_text())
          assert index['software']['development_source_commit'] == source['development_source_commit'], 'Source commit differs'
          for name, record in source['files'].items():
              assert index['files'][name]['sha256'] == record['sha256'], f'Source export differs: {name}'
          print(f'Validated {len(index["files"])} index entries and source identity')
          PY

  saved-prediction-reconstruction:
    runs-on: ubuntu-24.04
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      # Native export identity also verified by the completed independent rebuild.
      ACCEPTANCE_SHA: 7340fcc5d1fdc52b27ff3c0385d86669df97345897f95efa92bcb795dba5ba03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install pinned CPU reconstruction dependencies
        run: |
          python -c 'import sys; assert sys.version_info[:3] == (3, 12, 3)'
          python -m venv "$RUNNER_TEMP/cetus-reconstruction-venv"
          "$RUNNER_TEMP/cetus-reconstruction-venv/bin/python" -m pip install \
            --only-binary=:all: --require-hashes \
            -r release/longitude-adaptation-controls-20260930/code/requirements.txt
          "$RUNNER_TEMP/cetus-reconstruction-venv/bin/python" -m pip check
      - name: Verify and rebuild saved prediction package
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/cetus-matplotlib
          TMPDIR: ${{ runner.temp }}/cetus-temporary
        run: |
          [[ "$ACCEPTANCE_SHA" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$MPLCONFIGDIR" "$TMPDIR"
          PACKAGE="$GITHUB_WORKSPACE/release/longitude-adaptation-controls-20260930"
          cd "$PACKAGE/code"
          "$RUNNER_TEMP/cetus-reconstruction-venv/bin/python" -B \
            -m scripts.verify_repaired_adaptation_release \
            --package "$PACKAGE" \
            --frozen-package "$PACKAGE/../longitude-review-20260929" \
            --auxiliary-package "$PACKAGE/../longitude-auxiliary-20260929" \
            --acceptance-sha256 "$ACCEPTANCE_SHA" \
            --output "$RUNNER_TEMP/cetus-rebuilt-package"
      - name: Reconstruct October interpretation results
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/cetus-interpretation-matplotlib
          TMPDIR: ${{ runner.temp }}/cetus-interpretation-temporary
        run: |
          mkdir -p "$MPLCONFIGDIR" "$TMPDIR"
          PACKAGE="$GITHUB_WORKSPACE/release/interpretation-20261001"
          cd "$PACKAGE/code"
          "$RUNNER_TEMP/cetus-reconstruction-venv/bin/python" -B \
            verify_reconstruction.py --release-root "$PACKAGE/.." \
            --output "$RUNNER_TEMP/cetus-interpretation-rebuilt"
      - name: Reconstruct current fitting, coverage and initialization results
        run: |
          set -eu
          export CETUS_PACKAGE="$GITHUB_WORKSPACE/release/titan-followup-20261109"
          export CETUS_REPLAY_WORK="$RUNNER_TEMP/cetus-followup-reconstruction"
          export CETUS_PYTHON="$RUNNER_TEMP/cetus-reconstruction-venv/bin/python"
          test ! -e "$CETUS_REPLAY_WORK"
          mkdir "$CETUS_REPLAY_WORK"
          mkdir "$CETUS_REPLAY_WORK/reports"
          export CUDA_VISIBLE_DEVICES='' PYTHONDONTWRITEBYTECODE=1
          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          "$CETUS_PYTHON" -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          package = Path(os.environ['CETUS_PACKAGE']).resolve()
          work = Path(os.environ['CETUS_REPLAY_WORK']).resolve()
          pins = {
              'scientific': '67b6aa65be5bab9b7cbe83df90aafcf7b479117291562471652f59ed7f182a1d',
              'followup': '6a6179b76278d7fac55924643a24133d9304deb8a77d1706316e1d171d775eaf',
              'initialization': 'ada744e9278f4fbac5f5f953b5688132ad0b080b35cff32ed23b7f02c3192486',
              'reassessment': '7c4a2f80e53b0c7834e526d10a4f334da40d376ba9a5c74f218505f6ec7c8dff',
          }
          counts = {'scientific': 203, 'followup': 84, 'initialization': 19, 'reassessment': 54}
          for name, expected in pins.items():
              archive = package / (name + '-supplement.zip')
              with archive.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected, name
              destination = work / name
              destination.mkdir()
              with zipfile.ZipFile(archive) as z:
                  members = z.infolist()
                  assert len(members) == counts[name]
                  assert len({m.filename for m in members}) == len(members)
                  for member in members:
                      rel = PurePosixPath(member.filename)
                      assert not rel.is_absolute() and '..' not in rel.parts
                      assert str(rel) == member.filename and '\\' not in member.filename
                      assert not stat.S_ISLNK(member.external_attr >> 16)
                  z.extractall(destination)
          PY

          (cd "$CETUS_REPLAY_WORK/scientific" && sha256sum -c SHA256SUMS)
          (cd "$CETUS_REPLAY_WORK/followup" && sha256sum -c SHA256SUMS)
          (cd "$CETUS_REPLAY_WORK/initialization" && sha256sum -c SHA256SUMS)
          # Reassessment has MANIFEST.json, not SHA256SUMS; check.py verifies its members.

          (
            cd "$CETUS_REPLAY_WORK/scientific"
            "$CETUS_PYTHON" -B scripts/replay_metrics.py \
              --output "$CETUS_REPLAY_WORK/reports/scientific.json"
            "$CETUS_PYTHON" -B scripts/prepare_cvpr_tables.py \
              --output paper/cvpr2027/tables --check
          )
          (
            cd "$CETUS_REPLAY_WORK/followup/coverage"
            "$CETUS_PYTHON" -B analyze_sar_coverage.py \
              --package "$CETUS_PACKAGE/scientific-supplement.zip" \
              --sha256 67b6aa65be5bab9b7cbe83df90aafcf7b479117291562471652f59ed7f182a1d \
              --output "$CETUS_REPLAY_WORK/reports/coverage.json"
            "$CETUS_PYTHON" -B - <<'PY'
          import json
          import os
          from pathlib import Path
          original = json.loads(Path('results.json').read_text())
          replayed = json.loads((Path(os.environ['CETUS_REPLAY_WORK']) /
                                 'reports/coverage.json').read_text())
          original.pop('execution')
          replayed.pop('execution')
          assert original == replayed
          PY
          )
          (
            cd "$CETUS_REPLAY_WORK/followup/label-support"
            "$CETUS_PYTHON" -B replay_vote_inputs.py data \
              --report "$CETUS_REPLAY_WORK/reports/votes.json" \
              --expect-manifest-sha256 be98e9950e19641889e8e8234a43b3b2913648848407df38796fc58b9e556e69
          )
          (
            cd "$CETUS_REPLAY_WORK/initialization"
            "$CETUS_PYTHON" -B reconstruct.py \
              --output "$CETUS_REPLAY_WORK/reports/initialization.json"
          )
          (
            cd "$CETUS_REPLAY_WORK/reassessment"
            "$CETUS_PYTHON" -B check.py \
              --initialization-zip "$CETUS_PACKAGE/initialization-supplement.zip" \
              > "$CETUS_REPLAY_WORK/reports/reassessment.json"
          )
