name: Class ranking and geographic displays

on: [push, pull_request]

permissions:
  contents: read

jobs:
  display:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install plotting and test dependencies
        run: |
          python -m pip install --only-binary=:all: -r release/crater-retrieval-20261114/requirements.txt pytest==9.0.3
      - name: Set plotting cache directory
        run: echo "MPLCONFIGDIR=$RUNNER_TEMP/crater-retrieval-matplotlib" >> "$GITHUB_ENV"
      - name: Check renderer examples
        working-directory: release/crater-retrieval-20261114
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          python -B -m pytest tests/test_crater_retrieval_plot.py \
            tests/test_class_ranking_plot.py tests/test_class_contrasts_plot.py \
            tests/test_regional_errors_plot.py tests/test_class_retrieval_plot.py \
            tests/test_dataset_geography_plot.py -q -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/crater-retrieval-tests"
      - name: Render saved Craters rankings
        working-directory: release/crater-retrieval-20261114
        run: |
          set -euo pipefail
          python -B -m scripts.plot_crater_retrieval \
            --report ../class-ranking-20261111/results.json \
            --report-sha256 f8d798aec2772253071cece9af84acebe7ba517af5a0c320082b1606b723b03d \
            --curves ../class-ranking-20261111/craters-curves.npz \
            --curves-sha256 74f8fb2159edf44a7d95c7abb7f3aaa582b74fb2aaf1951222a1fa2cd09c63c4 \
            --output "$RUNNER_TEMP/crater-retrieval"
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'crater-retrieval'
          for name, expected in json.loads(Path('manifest.json').read_text())['expected_figures'].items():
              data = (output / name).read_bytes()
              assert {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()} == expected, name
          print('Both figure variants match the supplied display records.')
          PY
          sha256sum -c SHA256SUMS
          test -z "$(git status --porcelain=v1)"
      - name: Render regional AP contrasts and absolute AP
        working-directory: release/crater-retrieval-20261114
        run: |
          set -euo pipefail
          python -B -m scripts.plot_class_contrasts \
            --report ../class-ranking-20261111/results.json \
            --report-sha256 f8d798aec2772253071cece9af84acebe7ba517af5a0c320082b1606b723b03d \
            --output "$RUNNER_TEMP/class-contrasts"
          python -B -m scripts.plot_class_ranking \
            --report ../class-ranking-20261111/results.json \
            --report-sha256 f8d798aec2772253071cece9af84acebe7ba517af5a0c320082b1606b723b03d \
            --output "$RUNNER_TEMP/absolute-ap"
          python -B - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          for folder, field in [('class-contrasts', 'expected_class_contrasts'),
                                ('absolute-ap', 'expected_absolute_ap')]:
              output = Path(os.environ['RUNNER_TEMP']) / folder
              for name, expected in manifest[field].items():
                  data = (output / name).read_bytes()
                  assert {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()} == expected, name
          print('Regional contrasts and absolute AP match the supplied displays.')
          PYCODE
          sha256sum -c SHA256SUMS
          test -z "$(git status --porcelain=v1)"
      - name: Render regional SGD results
        working-directory: release/crater-retrieval-20261114
        run: |
          set -euo pipefail
          python -B -m scripts.plot_regional_errors \
            --report regional-errors.json \
            --report-sha256 a1cf71116346d44d7239d3736b6580fb9ea1d9c42a17fc1055e2422a6e22dd07 \
            --output "$RUNNER_TEMP/regional-errors"
          python -B - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'regional-errors'
          expected = json.loads(Path('manifest.json').read_text())['expected_regional_errors']
          for name, record in expected.items():
              data = (output / name).read_bytes()
              assert {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()} == record, name
          print('Regional displays match the supplied figures.')
          PYCODE
          sha256sum -c SHA256SUMS
          test -z "$(git status --porcelain=v1)"
      - name: Render all-class retrieval and geographic sampling
        working-directory: release/crater-retrieval-20261114
        run: |
          set -euo pipefail
          python -B -m scripts.plot_class_retrieval \
            --report ../class-ranking-20261111/results.json \
            --report-sha256 f8d798aec2772253071cece9af84acebe7ba517af5a0c320082b1606b723b03d \
            --export data/class-retrieval.json \
            --export-sha256 b03ce1da11d41c6b92b0e75b669f57d7f3db887dff840da6a808ea0d938c9de2 \
            --curves data/class-curves.npz \
            --curves-sha256 f31fab61e09b81555119379d916ddce6c5ec88947c7126b92ea46aa4f0927e1c \
            --output "$RUNNER_TEMP/class-retrieval"
          for style in cvpr full; do
            python -B -m scripts.plot_dataset_geography \
              --payload data/dataset-geography.json \
              --payload-sha256 6619ff667273aaa0273bcab1614ef3dff1e6453f1d79309d350da13e5508591d \
              --style "$style" \
              --output "$RUNNER_TEMP/geography-$style" \
              --receipt "$RUNNER_TEMP/geography-$style-receipt.json"
          done
          python -B - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads(Path('manifest.json').read_text())
          groups = [('class-retrieval', manifest['expected_class_retrieval'])]
          groups += [('geography-' + style, manifest['expected_dataset_geography'][style])
                     for style in ('cvpr', 'full')]
          assert [len(expected) for _, expected in groups] == [24, 8, 8]
          for folder, expected in groups:
              output = root / folder
              actual = {p.name for p in output.iterdir() if p.suffix in ('.pdf', '.png')}
              assert actual == set(expected), folder
              for name, record in expected.items():
                  data = (output / name).read_bytes()
                  assert {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()} == record, name
          print('All 40 retrieval and geographic figures match the supplied displays.')
          PYCODE
          sha256sum -c SHA256SUMS
          test -z "$(git status --porcelain=v1)"
      - name: Preserve figure and display records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crater-retrieval-display
          path: |
            ${{ runner.temp }}/crater-retrieval
            ${{ runner.temp }}/class-contrasts
            ${{ runner.temp }}/absolute-ap
            ${{ runner.temp }}/regional-errors
            ${{ runner.temp }}/class-retrieval
            ${{ runner.temp }}/geography-*
          if-no-files-found: warn
