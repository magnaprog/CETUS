[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cetus-sar"
version = "0.2.0"
description = "Evaluate terrain classifiers on Cassini radar images of Titan"
readme = "docs/classifiers.md"
license = "MIT"
license-files = ["LICENSE", "licenses/CROMA-LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Kevin Lee"}]
dependencies = ["torch>=2.4", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
encoders = ["torchvision>=0.19", "timm>=1.0", "einops>=0.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cetus_sar", "cetus_sar.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
