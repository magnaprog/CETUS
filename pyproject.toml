[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titansar"
version = "0.1.0"
description = "CETUS frozen Titan terrain evaluation"
readme = "SOFTWARE.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kevin Lee"}]
dependencies = ["torch>=2.4", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
encoders = ["torchvision>=0.19", "timm>=1.0", "einops>=0.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["titansar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
